<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Documentos do veículo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            margin: 0;
            padding: 30px 20px;

            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        h2 {
            font-size: 22px;
        }

        .dados-veiculo {
            padding: 18px;

            margin-bottom: 25px;

            background-color: white;

            border-radius: 10px;
        }

        .dados-veiculo p {
            margin: 8px 0;
            font-size: 17px;
        }

        .mensagem-sucesso {
            color: #146c2e;
            background-color: #e7f5eb;

            padding: 12px;

            border-radius: 7px;
        }

        .mensagem-erro {
            color: #b00020;
            background-color: #ffe9ed;

            padding: 12px;

            border-radius: 7px;
        }

        .tabela-container {
            width: 100%;

            overflow-x: auto;

            background-color: white;

            border-radius: 10px;

            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 750px;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;

            border: 1px solid #ddd;

            text-align: left;

            font-size: 16px;

            white-space: nowrap;
        }

        th {
            background-color: #eeeeee;
        }

        td a {
            display: inline-block;

            padding: 8px 12px;

            background-color: #eee;

            border-radius: 6px;

            color: #222;

            text-decoration: none;
        }

        td form {
            margin: 0;
        }

        td button {
            min-height: 40px;

            padding: 8px 12px;

            border: none;
            border-radius: 6px;

            background-color: #b3261e;
            color: white;

            cursor: pointer;
        }

        .upload-box {
            margin-top: 30px;

            padding: 24px;

            background-color: white;

            border-radius: 10px;
        }

        .upload-box label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-size: 17px;
            font-weight: bold;
        }

        .upload-box select,
        .upload-box input[type="file"] {
            width: 100%;

            min-height: 50px;

            padding: 10px;

            font-size: 17px;

            border: 1px solid #aaa;
            border-radius: 7px;

            background-color: white;
        }

        .upload-box button {
            width: 100%;

            min-height: 52px;

            padding: 12px;

            margin-top: 22px;

            border: none;
            border-radius: 7px;

            background-color: #222;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .voltar {
            display: inline-block;

            margin-top: 25px;

            min-height: 48px;

            padding: 12px 16px;

            border: 1px solid #aaa;
            border-radius: 7px;

            background-color: white;

            color: #222;

            font-size: 17px;

            text-decoration: none;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 21px;
            }

            .dados-veiculo,
            .upload-box {
                padding: 18px;
            }

            .upload-box select,
            .upload-box input,
            .upload-box button {
                font-size: 18px;
            }

            .voltar {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Documentos do veículo
    </h1>


    <div class="dados-veiculo">

        <h2>

            <span th:text="${veiculo.marca}">
            </span>

            <span th:text="${veiculo.modelo}">
            </span>

        </h2>


        <p>

            <strong>
                Placa:
            </strong>

            <span th:text="${veiculo.placa}">
            </span>

        </p>


        <p>

            <strong>
                Ano:
            </strong>

            <span th:text="${veiculo.anoModelo}">
            </span>

        </p>

    </div>


    <h2>
        Documentos cadastrados
    </h2>


    <p th:if="${sucesso}"
       th:text="${sucesso}"
       role="status"
       class="mensagem-sucesso">
    </p>


    <p th:if="${erro}"
       th:text="${erro}"
       role="alert"
       class="mensagem-erro">
    </p>


    <div class="tabela-container">

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Data de upload</th>
                <th>Download</th>
                <th>Ações</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="documento : ${documentos}">

                <td th:text="${documento.idDocumento}">
                </td>

                <td th:text="${documento.nome}">
                </td>

                <td th:text="${documento.tipoDocumento}">
                </td>

                <td th:text="${documento.dataUpload}">
                </td>


                <td>

                    <a th:href="@{/documentos/{id}/download(id=${documento.idDocumento})}">
                        Baixar
                    </a>

                </td>


                <td>

                    <form th:action="@{/veiculos/{idVeiculo}/documentos/{idDocumento}/excluir(idVeiculo=${veiculo.idVeiculo},idDocumento=${documento.idDocumento})}"
                          method="post"
                          onsubmit="return confirm('Excluir o registro deste documento? Esta ação não pode ser desfeita.');">

                        <button type="submit">
                            Excluir
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <div class="upload-box">

        <h2>
            Enviar novo documento
        </h2>


        <form th:action="@{/documentos/upload-form}"
              method="post"
              enctype="multipart/form-data">


            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <input type="hidden"
                   name="idVeiculo"
                   th:value="${veiculo.idVeiculo}">


            <label for="tipoDocumento">
                Tipo do documento
            </label>


            <select id="tipoDocumento"
                    name="tipoDocumento"
                    required>

                <option value="">
                    Selecione
                </option>

                <option value="ATPV">
                    ATPV
                </option>

                <option value="CRLV">
                    CRLV
                </option>

                <option value="CRV">
                    CRV
                </option>

                <option value="LAUDO_CAUTELAR">
                    Laudo cautelar
                </option>

                <option value="CONTRATO_COMPRA">
                    Contrato de compra
                </option>

                <option value="CONTRATO_VENDA">
                    Contrato de venda
                </option>

                <option value="NOTA_FISCAL">
                    Nota fiscal
                </option>

                <option value="OUTRO">
                    Outro
                </option>

            </select>


            <label for="arquivo">
                Arquivo
            </label>

            <input type="file"
                   id="arquivo"
                   name="arquivo"
                   required>


            <button type="submit">
                Enviar documento
            </button>

        </form>

    </div>


    <a class="voltar"
       th:href="@{/veiculos/tela}">
        ← Voltar para veículos
    </a>

</div>

</body>
</html>
