<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar usuário</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 17px;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 12px;
            font-size: 17px;

            border: 1px solid #aaa;
            border-radius: 7px;
        }

        button {
            width: 100%;
            min-height: 52px;
            margin-top: 25px;

            padding: 12px;

            font-size: 17px;
            font-weight: bold;

            border: none;
            border-radius: 7px;

            background-color: #222;
            color: white;

            cursor: pointer;
        }

        .voltar {
            display: block;
            margin-top: 22px;

            text-align: center;

            font-size: 17px;
            text-decoration: none;

            color: #333;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 22px 18px;
            }

            h1 {
                font-size: 26px;
            }

            input,
            button {
                font-size: 18px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Cadastrar usuário
    </h1>

    <form th:action="@{/cadastro}"
          method="post">

        <label for="login">
            Login
        </label>

        <input type="text"
               id="login"
               name="login"
               autocomplete="username"
               required>


        <label for="senha">
            Senha
        </label>

        <input type="password"
               id="senha"
               name="senha"
               autocomplete="new-password"
               required>


        <label for="confirmarSenha">
            Confirmar senha
        </label>

        <input type="password"
               id="confirmarSenha"
               name="confirmarSenha"
               autocomplete="new-password"
               required>


        <button type="submit">
            Cadastrar
        </button>

    </form>

    <a class="voltar"
       th:href="@{/principal}">
        ← Voltar
    </a>

</div>

<script>

    const senha =
        document.getElementById("senha");

    const confirmarSenha =
        document.getElementById("confirmarSenha");


    function validarConfirmacao() {

        confirmarSenha.setCustomValidity(
            senha.value === confirmarSenha.value
                ? ""
                : "As senhas não coincidem."
        );
    }


    senha.addEventListener(
        "input",
        validarConfirmacao
    );

    confirmarSenha.addEventListener(
        "input",
        validarConfirmacao
    );

</script>

</body>
</html>
