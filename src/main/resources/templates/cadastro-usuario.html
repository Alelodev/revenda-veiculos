<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        form {
            width: 350px;
            max-width: 100%;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
<h1>Cadastrar usuário</h1>

<form action="/cadastro" th:action="@{/cadastro}" method="post">
    <label for="login">Login</label>
    <input type="text" id="login" name="login" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="new-password" required>

    <label for="confirmarSenha">Confirmar senha</label>
    <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password" required>

    <button type="submit">Cadastrar</button>
</form>

<br>
<a href="/" th:href="@{/}">Voltar</a>

<script>
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmarSenha');

    function validarConfirmacao() {
        confirmarSenha.setCustomValidity(
            senha.value === confirmarSenha.value ? '' : 'As senhas não coincidem.'
        );
    }

    senha.addEventListener('input', validarConfirmacao);
    confirmarSenha.addEventListener('input', validarConfirmacao);
</script>
</body>
</html>
