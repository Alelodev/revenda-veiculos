<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Proprietários</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            margin: 0;
            padding: 30px 20px;

            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 22px;

            font-size: 30px;
        }

        .acoes-topo {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;
        }

        .acoes-topo a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 46px;

            padding: 10px 16px;

            border: 1px solid #aaa;
            border-radius: 7px;

            background-color: white;

            color: #222;

            font-size: 16px;

            text-decoration: none;
        }

        .mensagem-sucesso {
            color: #146c2e;
            background-color: #e7f5eb;
            padding: 12px;
            border-radius: 7px;
        }

        .mensagem-erro {
            color: #b00020;
            background-color: #ffe9ed;
            padding: 12px;
            border-radius: 7px;
        }

        .tabela-container {
            width: 100%;

            overflow-x: auto;

            background-color: white;

            border-radius: 10px;

            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;

            width: 100%;
            min-width: 1050px;
        }

        th,
        td {
            border: 1px solid #ddd;

            padding: 13px;

            text-align: left;

            font-size: 16px;

            white-space: nowrap;
        }

        th {
            background-color: #eeeeee;
        }

        td form {
            margin: 0;
        }

        td button {
            min-height: 40px;

            padding: 8px 12px;

            border: none;
            border-radius: 6px;

            background-color: #b3261e;
            color: white;

            cursor: pointer;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
            }

            h1 {
                font-size: 26px;
            }

            .acoes-topo {
                display: grid;
                grid-template-columns: 1fr;
            }

            .acoes-topo a {
                width: 100%;
                min-height: 50px;

                font-size: 17px;
            }

            th,
            td {
                font-size: 16px;
                padding: 12px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Proprietários
    </h1>


    <div class="acoes-topo">

        <a th:href="@{/principal}">
            Início
        </a>

        <a th:href="@{/proprietarios/novo}">
            Cadastrar proprietário
        </a>

    </div>


    <p th:if="${sucesso}"
       th:text="${sucesso}"
       role="status"
       class="mensagem-sucesso">
    </p>


    <p th:if="${erro}"
       th:text="${erro}"
       role="alert"
       class="mensagem-erro">
    </p>


    <div class="tabela-container">

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Nome completo</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Endereço</th>
                <th>Email</th>
                <th>CNH</th>
                <th>Ações</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="proprietario : ${proprietarios}">

                <td th:text="${proprietario.idProprietario}">
                </td>

                <td th:text="${proprietario.nomeCompleto}">
                </td>

                <td th:text="${proprietario.cpf}">
                </td>

                <td th:text="${proprietario.telefone}">
                </td>

                <td th:text="${proprietario.endereco}">
                </td>

                <td th:text="${proprietario.email}">
                </td>

                <td th:text="${proprietario.cnh}">
                </td>

                <td>

                    <form th:action="@{/proprietarios/{id}/excluir(id=${proprietario.idProprietario})}"
                          method="post"
                          onsubmit="return confirm('Deseja excluir este cadastro? Esta ação não pode ser desfeita.');">

                        <button type="submit">
                            Excluir
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
