<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Cadastrar veículo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            width: 350px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Cadastrar veículo</h1>

<form action="/veiculos/form"
      method="post"
      onsubmit="prepararMarca()">

    <label>
        Proprietário
    </label>

    <select name="proprietario.idProprietario"
            required>

        <option value="">
            Selecione um proprietário
        </option>

        <option th:each="proprietario : ${proprietarios}"
                th:value="${proprietario.idProprietario}"
                th:text="${proprietario.nomeCompleto}">
        </option>

    </select>

    <label>Marca</label>

    <select id="marca" required>

        <option value="">
            Selecione
        </option>

        <option value="Toyota">
            Toyota
        </option>

        <option value="Honda">
            Honda
        </option>

        <option value="Volkswagen">
            Volkswagen
        </option>

        <option value="Fiat">
            Fiat
        </option>

        <option value="Chevrolet">
            Chevrolet
        </option>

        <option value="Ford">
            Ford
        </option>

        <option value="Hyundai">
            Hyundai
        </option>

        <option value="Renault">
            Renault
        </option>

        <option value="Jeep">
            Jeep
        </option>

        <option value="Nissan">
            Nissan
        </option>

        <option value="OUTRA">
            Outra
        </option>

    </select>

    <input type="hidden"
           name="marca"
           id="marcaFinal">

    <div id="campoOutraMarca"
         style="display: none;">

        <label>
            Digite a marca
        </label>

        <input type="text"
               id="outraMarca">

    </div>

    <label>
        Modelo
    </label>

    <input type="text"
           name="modelo"
           required>

    <label>
        Ano de fabricação
    </label>

    <input type="number"
           name="anoFabricacao">

    <label>
        Ano modelo
    </label>

    <input type="number"
           name="anoModelo">

    <label>
        Placa
    </label>

    <input type="text"
           name="placa"
           required>

    <label>
        Cor
    </label>

    <input type="text"
           name="cor">

    <label>
        Tipo de combustível
    </label>

    <input type="text"
           name="tipoCombustivel">

    <label>
        RENAVAM
    </label>

    <input type="text"
           name="renavam">

    <label>
        Chassi
    </label>

    <input type="text"
           name="chassi">

    <label>
        Quilometragem
    </label>

    <input type="number"
           name="quilometragem">

    <label>
        Valor de compra
    </label>

    <input type="number"
           step="0.01"
           name="valorCompra">

    <label>
        Valor de venda
    </label>

    <input type="number"
           step="0.01"
           name="valorVenda">

    <label>
        Status
    </label>

    <select name="status">

        <option value="EM_ESTOQUE">
            Em estoque
        </option>

        <option value="RESERVADO">
            Reservado
        </option>

        <option value="VENDIDO">
            Vendido
        </option>

    </select>

    <button type="submit">
        Cadastrar
    </button>

</form>

<br>

<a href="/veiculos/tela">
    Voltar
</a>

<script>
    const marcaSelect = document.getElementById("marca");
    const campoOutraMarca = document.getElementById("campoOutraMarca");
    const outraMarca = document.getElementById("outraMarca");

    marcaSelect.addEventListener("change", function () {

        if (marcaSelect.value === "OUTRA") {
            campoOutraMarca.style.display = "block";
            outraMarca.required = true;
        } else {
            campoOutraMarca.style.display = "none";
            outraMarca.required = false;
            outraMarca.value = "";
        }

    });

    function prepararMarca() {

        const marcaSelecionada = marcaSelect.value;
        const marcaFinal = document.getElementById("marcaFinal");

        if (marcaSelecionada === "OUTRA") {
            marcaFinal.value = outraMarca.value;
        } else {
            marcaFinal.value = marcaSelecionada;
        }
    }
</script>

</body>
</html>
