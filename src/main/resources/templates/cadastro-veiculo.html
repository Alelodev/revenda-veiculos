<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Cadastrar veículo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            width: 350px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Cadastrar veículo</h1>

<form th:action="@{/veiculos/form}"
      method="post"
      onsubmit="prepararCampos()">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">


    <!-- PROPRIETÁRIO -->

    <label>Proprietário</label>

    <select name="proprietario.idProprietario"
            required>

        <option value="">
            Selecione um proprietário
        </option>

        <option th:each="proprietario : ${proprietarios}"
                th:value="${proprietario.idProprietario}"
                th:text="${proprietario.nomeCompleto}">
        </option>

    </select>


    <!-- MARCA -->

    <label>Marca</label>

    <select id="marca" required>

        <option value="">Selecione</option>

        <option value="Toyota">Toyota</option>
        <option value="Honda">Honda</option>
        <option value="Volkswagen">Volkswagen</option>
        <option value="Fiat">Fiat</option>
        <option value="Chevrolet">Chevrolet</option>
        <option value="Ford">Ford</option>
        <option value="Hyundai">Hyundai</option>
        <option value="Renault">Renault</option>
        <option value="Jeep">Jeep</option>
        <option value="Nissan">Nissan</option>

        <option value="OUTRA">
            Outra
        </option>

    </select>

    <input type="hidden"
           name="marca"
           id="marcaFinal">

    <div id="campoOutraMarca"
         style="display: none;">

        <label>Digite a marca</label>

        <input type="text"
               id="outraMarca">

    </div>


    <!-- MODELO -->

    <label>Modelo</label>

    <input type="text"
           name="modelo"
           required>


    <!-- ANO FABRICAÇÃO -->

    <label>Ano de fabricação</label>

    <input type="number"
           name="anoFabricacao"
           min="1900"
           max="2100">


    <!-- ANO MODELO -->

    <label>Ano modelo</label>

    <input type="number"
           name="anoModelo"
           min="1900"
           max="2100">


    <!-- PLACA -->

    <label>Placa</label>

    <input type="text"
           name="placa"
           maxlength="8"
           required>


    <!-- COR -->

    <label>Cor</label>

    <select id="cor">

        <option value="">
            Selecione
        </option>

        <option value="Branco">Branco</option>
        <option value="Preto">Preto</option>
        <option value="Prata">Prata</option>
        <option value="Cinza">Cinza</option>
        <option value="Vermelho">Vermelho</option>
        <option value="Azul">Azul</option>
        <option value="Verde">Verde</option>
        <option value="Amarelo">Amarelo</option>
        <option value="Marrom">Marrom</option>
        <option value="Bege">Bege</option>
        <option value="Laranja">Laranja</option>
        <option value="Roxo">Roxo</option>

        <option value="OUTRA">
            Outra
        </option>

    </select>

    <input type="hidden"
           name="cor"
           id="corFinal">

    <div id="campoOutraCor"
         style="display: none;">

        <label>Digite a cor</label>

        <input type="text"
               id="outraCor">

    </div>


    <!-- COMBUSTÍVEL -->

    <label>Tipo de combustível</label>

    <select id="tipoCombustivel">

        <option value="">
            Selecione
        </option>

        <option value="Gasolina">Gasolina</option>
        <option value="Etanol">Etanol</option>
        <option value="Flex">Flex</option>
        <option value="Diesel">Diesel</option>
        <option value="GNV">GNV</option>
        <option value="Elétrico">Elétrico</option>
        <option value="Híbrido">Híbrido</option>

        <option value="OUTRO">
            Outro
        </option>

    </select>

    <input type="hidden"
           name="tipoCombustivel"
           id="tipoCombustivelFinal">

    <div id="campoOutroCombustivel"
         style="display: none;">

        <label>Digite o tipo de combustível</label>

        <input type="text"
               id="outroCombustivel">

    </div>


    <!-- RENAVAM -->

    <label>RENAVAM</label>

    <input type="text"
           name="renavam">


    <!-- CHASSI -->

    <label>Chassi</label>

    <input type="text"
           name="chassi">


    <!-- QUILOMETRAGEM -->

    <label>Quilometragem</label>

    <input type="number"
           name="quilometragem"
           min="0">


    <!-- VALOR COMPRA -->

    <label>Valor de compra</label>

    <input type="number"
           step="0.01"
           min="0"
           name="valorCompra">


    <!-- VALOR VENDA -->

    <label>Valor de venda</label>

    <input type="number"
           step="0.01"
           min="0"
           name="valorVenda">


    <!-- STATUS -->

    <label>Status</label>

    <select name="status">

        <option value="EM_ESTOQUE">
            Em estoque
        </option>

        <option value="RESERVADO">
            Reservado
        </option>

        <option value="VENDIDO">
            Vendido
        </option>

    </select>


    <button type="submit">
        Cadastrar
    </button>

</form>

<br>

<a th:href="@{/veiculos/tela}">
    Voltar
</a>


<script>

    // =====================================================
    // MARCA
    // =====================================================

    const marcaSelect =
        document.getElementById("marca");

    const campoOutraMarca =
        document.getElementById("campoOutraMarca");

    const outraMarca =
        document.getElementById("outraMarca");


    marcaSelect.addEventListener(
        "change",
        function () {

            if (marcaSelect.value === "OUTRA") {

                campoOutraMarca.style.display =
                    "block";

                outraMarca.required = true;

            } else {

                campoOutraMarca.style.display =
                    "none";

                outraMarca.required = false;

                outraMarca.value = "";
            }
        }
    );


    // =====================================================
    // COR
    // =====================================================

    const corSelect =
        document.getElementById("cor");

    const campoOutraCor =
        document.getElementById("campoOutraCor");

    const outraCor =
        document.getElementById("outraCor");


    corSelect.addEventListener(
        "change",
        function () {

            if (corSelect.value === "OUTRA") {

                campoOutraCor.style.display =
                    "block";

                outraCor.required = true;

            } else {

                campoOutraCor.style.display =
                    "none";

                outraCor.required = false;

                outraCor.value = "";
            }
        }
    );


    // =====================================================
    // COMBUSTÍVEL
    // =====================================================

    const combustivelSelect =
        document.getElementById(
            "tipoCombustivel"
        );

    const campoOutroCombustivel =
        document.getElementById(
            "campoOutroCombustivel"
        );

    const outroCombustivel =
        document.getElementById(
            "outroCombustivel"
        );


    combustivelSelect.addEventListener(
        "change",
        function () {

            if (
                combustivelSelect.value ===
                "OUTRO"
            ) {

                campoOutroCombustivel
                    .style
                    .display = "block";

                outroCombustivel.required =
                    true;

            } else {

                campoOutroCombustivel
                    .style
                    .display = "none";

                outroCombustivel.required =
                    false;

                outroCombustivel.value =
                    "";
            }
        }
    );


    // =====================================================
    // PREPARAR CAMPOS ANTES DO ENVIO
    // =====================================================

    function prepararCampos() {

        // MARCA

        const marcaFinal =
            document.getElementById(
                "marcaFinal"
            );

        if (
            marcaSelect.value ===
            "OUTRA"
        ) {

            marcaFinal.value =
                outraMarca.value;

        } else {

            marcaFinal.value =
                marcaSelect.value;
        }


        // COR

        const corFinal =
            document.getElementById(
                "corFinal"
            );

        if (
            corSelect.value ===
            "OUTRA"
        ) {

            corFinal.value =
                outraCor.value;

        } else {

            corFinal.value =
                corSelect.value;
        }


        // COMBUSTÍVEL

        const combustivelFinal =
            document.getElementById(
                "tipoCombustivelFinal"
            );

        if (
            combustivelSelect.value ===
            "OUTRO"
        ) {

            combustivelFinal.value =
                outroCombustivel.value;

        } else {

            combustivelFinal.value =
                combustivelSelect.value;
        }
    }

</script>

</body>
</html>
