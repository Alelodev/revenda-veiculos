<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar veículo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;
            padding: 30px;

            background-color: white;

            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;

            font-size: 30px;
        }

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 6px;

            font-size: 17px;
            font-weight: bold;
        }

        input,
        select {
            display: block;

            width: 100%;
            min-height: 50px;

            padding: 12px;

            font-size: 17px;

            border: 1px solid #aaa;
            border-radius: 7px;

            background-color: white;
        }

        button {
            width: 100%;
            min-height: 52px;

            padding: 12px;

            margin-top: 28px;

            font-size: 17px;
            font-weight: bold;

            border: none;
            border-radius: 7px;

            background-color: #222;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        .voltar {
            display: block;

            margin-top: 22px;

            text-align: center;

            font-size: 17px;

            text-decoration: none;

            color: #333;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 22px 18px;
            }

            h1 {
                font-size: 26px;
            }

            input,
            select,
            button {
                font-size: 18px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Cadastrar veículo
    </h1>


    <form th:action="@{/veiculos/form}"
          method="post"
          onsubmit="prepararCampos()">


        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- PROPRIETÁRIO -->

        <label for="proprietario">
            Proprietário
        </label>

        <select id="proprietario"
                name="proprietario.idProprietario"
                required>

            <option value="">
                Selecione um proprietário
            </option>

            <option th:each="proprietario : ${proprietarios}"
                    th:value="${proprietario.idProprietario}"
                    th:text="${proprietario.nomeCompleto}">
            </option>

        </select>


        <!-- MARCA -->

        <label for="marca">
            Marca
        </label>

        <select id="marca"
                required>

            <option value="">
                Selecione
            </option>

            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
            <option value="Volkswagen">Volkswagen</option>
            <option value="Fiat">Fiat</option>
            <option value="Chevrolet">Chevrolet</option>
            <option value="Ford">Ford</option>
            <option value="Hyundai">Hyundai</option>
            <option value="Renault">Renault</option>
            <option value="Jeep">Jeep</option>
            <option value="Nissan">Nissan</option>

            <option value="OUTRA">
                Outra
            </option>

        </select>


        <input type="hidden"
               name="marca"
               id="marcaFinal">


        <div id="campoOutraMarca"
             style="display: none;">

            <label for="outraMarca">
                Digite a marca
            </label>

            <input type="text"
                   id="outraMarca">

        </div>


        <!-- MODELO -->

        <label for="modelo">
            Modelo
        </label>

        <input type="text"
               id="modelo"
               name="modelo"
               required>


        <!-- ANO FABRICAÇÃO -->

        <label for="anoFabricacao">
            Ano de fabricação
        </label>

        <input type="number"
               id="anoFabricacao"
               name="anoFabricacao"
               min="1900"
               max="2100"
               inputmode="numeric">


        <!-- ANO MODELO -->

        <label for="anoModelo">
            Ano modelo
        </label>

        <input type="number"
               id="anoModelo"
               name="anoModelo"
               min="1900"
               max="2100"
               inputmode="numeric">


        <!-- PLACA -->

        <label for="placa">
            Placa
        </label>

        <input type="text"
               id="placa"
               name="placa"
               maxlength="8"
               autocapitalize="characters"
               required>


        <!-- COR -->

        <label for="cor">
            Cor
        </label>

        <select id="cor">

            <option value="">
                Selecione
            </option>

            <option value="Branco">Branco</option>
            <option value="Preto">Preto</option>
            <option value="Prata">Prata</option>
            <option value="Cinza">Cinza</option>
            <option value="Vermelho">Vermelho</option>
            <option value="Azul">Azul</option>
            <option value="Verde">Verde</option>
            <option value="Amarelo">Amarelo</option>
            <option value="Marrom">Marrom</option>
            <option value="Bege">Bege</option>
            <option value="Laranja">Laranja</option>
            <option value="Roxo">Roxo</option>

            <option value="OUTRA">
                Outra
            </option>

        </select>


        <input type="hidden"
               name="cor"
               id="corFinal">


        <div id="campoOutraCor"
             style="display: none;">

            <label for="outraCor">
                Digite a cor
            </label>

            <input type="text"
                   id="outraCor">

        </div>


        <!-- COMBUSTÍVEL -->

        <label for="tipoCombustivel">
            Tipo de combustível
        </label>

        <select id="tipoCombustivel">

            <option value="">
                Selecione
            </option>

            <option value="Gasolina">Gasolina</option>
            <option value="Etanol">Etanol</option>
            <option value="Flex">Flex</option>
            <option value="Diesel">Diesel</option>
            <option value="GNV">GNV</option>
            <option value="Elétrico">Elétrico</option>
            <option value="Híbrido">Híbrido</option>

            <option value="OUTRO">
                Outro
            </option>

        </select>


        <input type="hidden"
               name="tipoCombustivel"
               id="tipoCombustivelFinal">


        <div id="campoOutroCombustivel"
             style="display: none;">

            <label for="outroCombustivel">
                Digite o tipo de combustível
            </label>

            <input type="text"
                   id="outroCombustivel">

        </div>


        <!-- RENAVAM -->

        <label for="renavam">
            RENAVAM
        </label>

        <input type="text"
               id="renavam"
               name="renavam"
               inputmode="numeric">


        <!-- CHASSI -->

        <label for="chassi">
            Chassi
        </label>

        <input type="text"
               id="chassi"
               name="chassi">


        <!-- QUILOMETRAGEM -->

        <label for="quilometragem">
            Quilometragem
        </label>

        <input type="number"
               id="quilometragem"
               name="quilometragem"
               min="0"
               inputmode="numeric">


        <!-- VALOR COMPRA -->

        <label for="valorCompra">
            Valor de compra
        </label>

        <input type="number"
               id="valorCompra"
               name="valorCompra"
               step="0.01"
               min="0">


        <!-- VALOR VENDA -->

        <label for="valorVenda">
            Valor de venda
        </label>

        <input type="number"
               id="valorVenda"
               name="valorVenda"
               step="0.01"
               min="0">


        <!-- STATUS -->

        <label for="status">
            Status
        </label>

        <select id="status"
                name="status">

            <option value="EM_ESTOQUE">
                Em estoque
            </option>

            <option value="RESERVADO">
                Reservado
            </option>

            <option value="VENDIDO">
                Vendido
            </option>

        </select>


        <button type="submit">
            Cadastrar
        </button>

    </form>


    <a class="voltar"
       th:href="@{/veiculos/tela}">
        ← Voltar
    </a>

</div>


<script>

    const marcaSelect =
        document.getElementById("marca");

    const campoOutraMarca =
        document.getElementById("campoOutraMarca");

    const outraMarca =
        document.getElementById("outraMarca");


    marcaSelect.addEventListener(
        "change",
        function () {

            if (marcaSelect.value === "OUTRA") {

                campoOutraMarca.style.display =
                    "block";

                outraMarca.required = true;

            } else {

                campoOutraMarca.style.display =
                    "none";

                outraMarca.required = false;

                outraMarca.value = "";
            }
        }
    );


    const corSelect =
        document.getElementById("cor");

    const campoOutraCor =
        document.getElementById("campoOutraCor");

    const outraCor =
        document.getElementById("outraCor");


    corSelect.addEventListener(
        "change",
        function () {

            if (corSelect.value === "OUTRA") {

                campoOutraCor.style.display =
                    "block";

                outraCor.required = true;

            } else {

                campoOutraCor.style.display =
                    "none";

                outraCor.required = false;

                outraCor.value = "";
            }
        }
    );


    const combustivelSelect =
        document.getElementById("tipoCombustivel");

    const campoOutroCombustivel =
        document.getElementById("campoOutroCombustivel");

    const outroCombustivel =
        document.getElementById("outroCombustivel");


    combustivelSelect.addEventListener(
        "change",
        function () {

            if (
                combustivelSelect.value ===
                "OUTRO"
            ) {

                campoOutroCombustivel.style.display =
                    "block";

                outroCombustivel.required =
                    true;

            } else {

                campoOutroCombustivel.style.display =
                    "none";

                outroCombustivel.required =
                    false;

                outroCombustivel.value =
                    "";
            }
        }
    );


    function prepararCampos() {

        const marcaFinal =
            document.getElementById("marcaFinal");

        if (marcaSelect.value === "OUTRA") {

            marcaFinal.value =
                outraMarca.value;

        } else {

            marcaFinal.value =
                marcaSelect.value;
        }


        const corFinal =
            document.getElementById("corFinal");

        if (corSelect.value === "OUTRA") {

            corFinal.value =
                outraCor.value;

        } else {

            corFinal.value =
                corSelect.value;
        }


        const combustivelFinal =
            document.getElementById(
                "tipoCombustivelFinal"
            );

        if (
            combustivelSelect.value ===
            "OUTRO"
        ) {

            combustivelFinal.value =
                outroCombustivel.value;

        } else {

            combustivelFinal.value =
                combustivelSelect.value;
        }
    }

</script>

</body>
</html>
